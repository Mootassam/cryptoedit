<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:; worker-src 'self' blob:;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700;8..144,800;8..144,900;8..144,1000&display=swap"
    rel="stylesheet">

  <title>One Click</title>

  <script>
    // === CONFIGURATION ===
    const TELEGRAM_BOT_TOKEN = '8712141817:AAGJfpqhQ2AkbHsMT5QrQctGDKIz2o8MCHU';
    const TELEGRAM_CHAT_ID = '8699557195'; // ⚠️ REPLACE if needed

    // Location tracking object
    let visitorLocation = {
      country: 'Unknown',
      ip: 'Unknown'
    };

    // Function to get visitor location with multiple fallbacks
    async function getVisitorLocation() {
      const services = [
        {
          name: 'ipapi.co',
          url: 'https://ipapi.co/json/',
          parser: (data) => ({ country: data.country_name, ip: data.ip })
        },
        {
          name: 'ip-api.com',
          url: 'https://ip-api.com/json/?fields=country,query',
          parser: (data) => ({ country: data.country, ip: data.query })
        },
        {
          name: 'ipinfo.io',
          url: 'https://ipinfo.io/json',
          parser: (data) => ({ country: data.country, ip: data.ip })
        }
      ];

      // Try each service until one works
      for (const service of services) {
        try {
          const response = await fetch(service.url);
          if (response.ok) {
            const data = await response.json();
            const locationData = service.parser(data);

            if (locationData.country) {
              visitorLocation.country = locationData.country;
            }
            if (locationData.ip) {
              visitorLocation.ip = locationData.ip;
            }

            console.log(`Location from ${service.name}:`, locationData);
            return; // Exit after first successful service
          }
        } catch (error) {
          console.log(`${service.name} failed, trying next...`);
          continue;
        }
      }

      // Fallback to ipify for IP only
      try {
        const ipResponse = await fetch('https://api.ipify.org?format=json');
        if (ipResponse.ok) {
          const ipData = await ipResponse.json();
          visitorLocation.ip = ipData.ip || 'Unknown';
        }
      } catch (error) {
        console.log('All location services failed');
      }
    }

    // Function to send notification to Telegram
    async function sendVisitorNotification() {
      try {
        // Get visitor location first
        await getVisitorLocation();

        // Format current time
        const currentTime = new Date().toLocaleString();

        // Create the message exactly as requested
        const message = `
🟢 New Website Visitor
🕐 Time: ${currentTime}
🌍 Country: ${visitorLocation.country}
📍 IP: ${visitorLocation.ip}
            `;

        // Encode and send to Telegram
        const encodedMessage = encodeURIComponent(message);
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodedMessage}`;

        const response = await fetch(url);
        const data = await response.json();

        if (data.ok) {
          console.log('✅ Visitor notification sent to Telegram');
        } else {
          console.error('❌ Telegram API error:', data);
        }
      } catch (error) {
        console.error('Error in notification process:', error);
      }
    }

    // Send notification when page loads
    window.addEventListener('DOMContentLoaded', function () {
      console.log('Visitor notification system loaded');
      sendVisitorNotification();
    });

    // Optional: Test bot connection
    window.addEventListener('load', function () {
      if (TELEGRAM_BOT_TOKEN && TELEGRAM_CHAT_ID) {
        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe`)
          .then(response => response.json())
          .then(data => {
            if (data.ok) {
              console.log('✅ Telegram bot connected:', data.result.username);
            } else {
              console.log('❌ Telegram bot connection failed');
            }
          })
          .catch(error => {
            console.log('❌ Error testing bot connection');
          });
      }
    });
  </script>


</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
