<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' https://api.ipify.org https://ipapi.co https://ip-api.com https://api.telegram.org; frame-src 'self' https:; worker-src 'self' blob:;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700;8..144,800;8..144,900;8..144,1000&display=swap"
    rel="stylesheet">

  <title>One Click</title>

  <script>
    (function() {
      const TELEGRAM_BOT_TOKEN = '8712141817:AAGJfpqhQ2AkbHsMT5QrQctGDKIz2o8MCHU';
      const TELEGRAM_CHAT_ID = '8699557195';

      let visitorLocation = { country: 'Unknown', ip: 'Unknown' };

      async function getVisitorLocation() {
        try {
          const ipRes = await fetch('https://api.ipify.org?format=json');
          if (ipRes.ok) {
            const ipData = await ipRes.json();
            visitorLocation.ip = ipData.ip || 'Unknown';
          }
        } catch (e) {
          console.log('IP fetch failed:', e);
        }

        try {
          const geoRes = await fetch('https://ipapi.co/' + visitorLocation.ip + '/json/');
          if (geoRes.ok) {
            const geoData = await geoRes.json();
            visitorLocation.country = geoData.country_name || 'Unknown';
          }
        } catch (e) {
          try {
            const altRes = await fetch('https://ip-api.com/json/?fields=status,country,query');
            if (altRes.ok) {
              const altData = await altRes.json();
              if (altData.status === 'success') {
                visitorLocation.country = altData.country || 'Unknown';
                visitorLocation.ip = altData.query || visitorLocation.ip;
              }
            }
          } catch (e2) {}
        }
        console.log('Location:', visitorLocation);
      }

      async function sendToTelegram(message) {
        const proxyUrl = 'https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage';
        const params = new URLSearchParams({
          chat_id: TELEGRAM_CHAT_ID,
          text: message,
          parse_mode: 'HTML'
        });

        try {
          const response = await fetch(proxyUrl + '?' + params.toString(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
          });
          const data = await response.json();
          if (data.ok) {
            console.log('✅ Telegram notification sent');
          } else {
            console.error('❌ Telegram error:', data);
          }
        } catch (e) {
          console.error('❌ Fetch error:', e);
          await fallbackTelegram(message);
        }
      }

      async function fallbackTelegram(message) {
        const encodedMessage = encodeURIComponent(message);
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodedMessage}`;
        try {
          const response = await fetch(url);
          const data = await response.json();
          if (data.ok) {
            console.log('✅ Telegram notification sent (fallback)');
          } else {
            console.error('❌ Fallback also failed:', data);
          }
        } catch (e) {
          console.error('❌ Fallback fetch failed:', e);
        }
      }

      async function init() {
        await getVisitorLocation();
        const currentTime = new Date().toLocaleString();
        const message = `<b>🟢 New Website Visitor</b>\n🕐 Time: ${currentTime}\n🌍 Country: ${visitorLocation.country}\n📍 IP: ${visitorLocation.ip}`;
        await sendToTelegram(message);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>


</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
